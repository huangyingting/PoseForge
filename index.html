<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PoseForge — Your pose studio</title>
    <meta name="theme-color" content="#f1f3ef" />
    <meta
      name="description"
      content="Explore pose studies, shape your figures, and build a library of your own."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231e675a'/%3E%3Cpath d='M10 24V8h7a5 5 0 010 10h-7' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/src/app/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#viewport">Skip to the studio</a>
    <div
      id="app"
      data-mobile="studio"
      data-library="open"
      data-inspector="closed"
    >
      <header class="topbar">
        <div class="topbar-start">
          <a class="brand" href="./" aria-label="PoseForge home"
            ><span class="brand-mark">p<span>f</span></span
            ><span>PoseForge</span></a
          >
          <button
            id="toggle-library"
            class="drawer-toggle"
            data-drawer="library"
            aria-controls="library"
            aria-expanded="true"
          >
            <span aria-hidden="true">▦</span> Library
          </button>
        </div>
        <div class="header-actions">
          <button id="language" class="language-switch" type="button" lang="zh-CN">
            中文
          </button>
          <div class="history-actions">
            <button
              id="undo"
              class="icon-button"
              aria-label="Undo"
              aria-keyshortcuts="Control+Z Meta+Z"
              title="Undo (Ctrl/⌘ Z)"
              disabled
            >
              ↶</button
            ><button
              id="redo"
              class="icon-button"
              aria-label="Redo"
              aria-keyshortcuts="Control+Shift+Z Meta+Shift+Z Control+Y"
              title="Redo (Ctrl/⌘ Shift Z or Ctrl Y)"
              disabled
            >
              ↷
            </button>
          </div>
          <button id="save-preset" class="action" disabled>Save preset</button>
          <button id="open-export" class="action primary" disabled>
            Export <span aria-hidden="true">↗</span>
          </button>
          <button
            id="toggle-inspector"
            class="drawer-toggle"
            data-drawer="inspector"
            aria-controls="panel"
            aria-expanded="false"
          >
            <span aria-hidden="true">☷</span> Edit
          </button>
        </div>
      </header>
      <aside id="library" aria-label="Pose library"></aside>
      <main id="stage" aria-label="3D studio">
        <div class="canvas-wrap">
          <canvas
            id="viewport"
            tabindex="0"
            aria-label="3D pose preview. Drag to orbit; pinch or scroll to zoom. Arrow keys rotate; plus and minus zoom; F fits the figures."
          ></canvas>
          <div
            id="viewport-error"
            class="viewport-error"
            role="alert"
            hidden
          ></div>
          <div id="loading" class="loading-indicator" aria-hidden="true"></div>
        </div>
        <div class="stage-overlay stage-top">
          <div class="stage-heading">
            <div class="scene-line">
              <h1 id="scene-title">Side by side</h1>
              <span id="scene-badge" class="badge">Built-in study</span>
            </div>
            <p id="scene-description">
              A little inspiration. Endless possibilities.
            </p>
          </div>
          <div class="stage-status">
            <span id="status" role="status" aria-live="polite"
              >Loading studio</span
            ><button id="show-notes" class="text-button" hidden>
              Pose checks
            </button>
          </div>
          <div id="position-actions" class="buttons position-actions" hidden>
            <button id="position-edit" class="action small">
              Edit posture
            </button>
            <button id="position-save" class="action small" disabled>
              Save position override
            </button>
          </div>
        </div>
        <div class="stage-overlay stage-bottom">
          <span class="camera-hint"
            >Drag to orbit <span aria-hidden="true">·</span> Pinch or scroll to
            zoom</span
          >
          <div class="stage-toolbar">
            <div class="view-buttons" role="group" aria-label="Camera views">
              <button
                data-view="three_quarter"
                class="active"
                aria-pressed="true"
              >
                3D</button
              ><button data-view="front" aria-pressed="false">Front</button
              ><button data-view="side" aria-pressed="false">Side</button
              ><button data-view="top" aria-pressed="false">Top</button>
            </div>
            <div class="tour-control">
              <button
                id="camera-tour"
                aria-pressed="true"
                title="Tour the camera round each position as it loads"
              >
                Tour
              </button>
            </div>
            <div class="zoom-controls" role="group" aria-label="Zoom controls">
              <button
                id="zoom-out"
                class="icon-button"
                aria-label="Zoom out"
                title="Zoom out"
              >
                −
              </button>
              <button
                id="fit-view"
                class="icon-button"
                aria-label="Fit figures"
                title="Fit figures (F)"
              >
                ⛶
              </button>
              <button
                id="zoom-in"
                class="icon-button"
                aria-label="Zoom in"
                title="Zoom in"
              >
                +
              </button>
            </div>
            <div class="material-control">
              <label for="setting" class="sr-only">Setting</label
              ><select id="setting"></select>
              <label for="material" class="sr-only">Material</label
              ><select id="material">
                <option value="natural">Natural</option>
                <option value="clay">Clay study</option>
              </select>
            </div>
          </div>
        </div>
      </main>
      <aside id="panel" aria-label="Scene inspector"></aside>
      <nav class="mobile-nav" aria-label="Workspace">
        <button data-region="library" aria-pressed="false">
          ▦ <span>Library</span></button
        ><button data-region="studio" aria-pressed="true" class="active">
          ◈ <span>Studio</span></button
        ><button data-region="edit" aria-pressed="false">
          ☷ <span>Edit</span>
        </button>
      </nav>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <noscript>PoseForge needs JavaScript to run the 3D studio.</noscript>
    <script type="module" src="/src/app/main.js"></script>
  </body>
</html>
